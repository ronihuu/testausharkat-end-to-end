name: Cypress E2E -testit

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  cypress:
    name: Suorita Cypress-testit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
        browser: [chrome, firefox, edge]

    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v6

      - name: Asenna Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Suorita Cypress-testit
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: ${{ matrix.browser }}
